name: Quality checks

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run regression tests, Worker dry-run and Astro build
        run: npm run check
        env:
          PUBLIC_API_BASE: ${{ vars.PUBLIC_API_BASE }}

      - name: Read-only staging smoke test
        if: ${{ vars.STAGING_API_BASE != '' }}
        run: npm run smoke:worker
        env:
          SMOKE_BASE_URL: ${{ vars.STAGING_API_BASE }}
          SMOKE_ORIGIN: ${{ vars.STAGING_SITE_ORIGIN }}
          SMOKE_REVIEW_TOKEN: ${{ secrets.STAGING_REVIEW_TOKEN }}
